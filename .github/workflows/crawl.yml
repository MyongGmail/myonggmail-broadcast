# 명지메일 크롤러 v2 — GitHub Actions 스케줄 실행.
#
#   incremental : 매일 5회 (UTC 23/02/05/08/12 ≒ KST 08/11/14/17/21시)
#   backfill    : 매주 일요일 03:00 KST (= UTC 토 18:00) — 전량 페이지네이션
#   수동 실행    : Actions 탭 또는 `gh workflow run crawl.yml -f mode=backfill`
#
# 시크릿(설정 절차는 infra/README.md):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY — 유일한 비밀(버킷 2종 한정 토큰)
#   ⚠ C3 완전 격리: 이 모듈은 Supabase 등 본체 백엔드에 접합하지 않는다(크롤→스냅샷→방송→R2가 전부)

name: crawl

on:
  schedule:
    - cron: "0 23,2,5,8,12 * * *"  # incremental (KST 08/11/14/17/21시)
    - cron: "0 18 * * 6"           # backfill (KST 일요일 03:00) — Resolve mode 스텝과 문자열 일치 필수
  workflow_dispatch:
    inputs:
      mode:
        description: "크롤 모드"
        type: choice
        options:
          - incremental
          - backfill
        default: incremental

permissions:
  contents: read

concurrency:
  group: crawl-mju
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # backfill 전량(1.2초/요청) 대비. incremental은 수 분 내 종료.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # incremental 상태(known dedup_key)·병합 스냅샷을 실행 간에 이어받는다.
      # 캐시가 증발해도 Supabase upsert가 멱등이라 데이터는 안전(상세 재수집만 늘어남).
      - name: Restore snapshot state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/snapshots
          key: snapshots-mju-${{ github.run_id }}
          restore-keys: |
            snapshots-mju-

      - name: Resolve mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          MODE=incremental
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 18 * * 6" ]; then
            MODE=backfill
          fi
          echo "mode=$MODE" | tee -a "$GITHUB_OUTPUT"

      - name: Crawl (incremental)
        if: steps.mode.outputs.mode == 'incremental'
        run: python3 -m pipeline.crawler.v2.run --school mju

      - name: Crawl (backfill)
        if: steps.mode.outputs.mode == 'backfill'
        run: python3 -m pipeline.crawler.v2.run --school mju --mode backfill --pages 0 --detail-limit 500

      - name: Save snapshot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/snapshots
          key: snapshots-mju-${{ github.run_id }}

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: pipeline/snapshots
          retention-days: 14
          if-no-files-found: warn

      # R2 시크릿 3종이 모두 설정된 경우에만 업로드(미설정이면 스킵 로그만 남김).
      # aws cli v2.23+의 CRC 체크섬 기본값은 R2와 충돌 — when_required로 고정.
      - name: Sync snapshots to R2 (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2 시크릿 미설정 — R2 업로드 스킵"
            exit 0
          fi
          aws s3 sync pipeline/snapshots "s3://myonggmail-snapshots" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      # P1b 방송(서킷 3 실체): v0 라인 포맷 생성 → public 버킷 정적 서빙.
      # 현재 입력은 리포 번들 notices_v2.json — Phase B에서 신선한 병합 산출로 교체 예정.
      # 버킷(myonggmail-broadcast)의 public access 설정은 사용자 Cloudflare 콘솔 작업.
      - name: Generate & sync broadcast v0 (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 -m pipeline.broadcast.generate --verify
          # ── 배포 스큐 가드 ────────────────────────────────────────────────────
          # --verify는 헤더의 층위 접두("d1.")만 본다 — 어떤 지문이든 통과한다.
          # 정작 위험한 건 "앱이 들고 있는 사전"과 "지금 올리려는 방송"이 어긋나는 것이고,
          # 그러면 앱이 방송을 **전량 폐기**한다(broadcast.ts:33). 에러도 배너도 없어서
          # "새 공지가 없는 앱"과 화면상 구분되지 않는다 — 사람이 알아챌 수 없는 사고다.
          # (입력은 전부 레포 안 파일이다 — 이벤트 페이로드 보간 없음)
          BUNDLE=packages/shared/config/broadcast_dict_d1.json
          if [ -f "$BUNDLE" ]; then
            WANT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$BUNDLE")
            GOT=$(head -1 pipeline/broadcast/out/latest.txt | cut -d'|' -f2)
            if [ "$WANT" != "$GOT" ]; then
              echo "::error::방송 사전 스큐 — 앱 번들=$WANT · 산출물=$GOT"
              echo "앱은 버전이 다르면 방송을 통째로 버린다(fail-closed). 배포 순서가 계약이다:"
              echo "  1) pipeline/broadcast/out/dict_d1.json 을 $BUNDLE 로 동기"
              echo "  2) 그 사전으로 APK를 다시 굽고 설치해 방송 실수신을 확인"
              echo "  3) 그 다음에만 송출한다"
              exit 1
            fi
            echo "사전 스큐 없음: $WANT"
          else
            echo "번들 사전 없음($BUNDLE) — 스큐 가드 스킵(앱을 갖지 않는 공개 모듈에서는 정상)"
          fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2 시크릿 미설정 — 방송 업로드 스킵(생성·검증만 수행)"
            exit 0
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync pipeline/broadcast/out "s3://myonggmail-broadcast/v0" \
            --endpoint-url "$EP" --exclude "latest.txt"
          # latest.txt만 gzip 본문 + Content-Encoding으로 덮어쓴다.
          # sync가 붙이는 기본 헤더로는 r2.dev가 무압축으로 서빙해서 앱이 매 콜드 스타트마다
          # 1.80 MiB를 그대로 받는다(2026-07-27 실측: 응답에 Content-Encoding 부재).
          # 이 두 줄로 1,891,825 → 528,775 B(3.6배). 앱 수정 0 · APK 재빌드 0 —
          # fetch().text()가 전송 압축을 투명하게 푼다.
          aws s3 cp pipeline/broadcast/out/latest.txt.gz "s3://myonggmail-broadcast/v0/latest.txt" \
            --endpoint-url "$EP" \
            --content-encoding gzip --content-type "text/plain; charset=utf-8"
          # 층위별 방송(public/commercial) — 채널이 없으면 생성기가 스킵하므로 디렉터리도 없다.
          # 앱은 켠 층위만 받아 간다(ToS 완화: 상용은 명시 선택자에게만 전송).
          for TIER in public commercial; do
            SRC="pipeline/broadcast/out/$TIER/latest.txt.gz"
            if [ ! -f "$SRC" ]; then
              echo "[$TIER] 산출 없음 — 업로드 스킵"
              continue
            fi
            aws s3 cp "$SRC" "s3://myonggmail-broadcast/v0/$TIER/latest.txt" \
              --endpoint-url "$EP" \
              --content-encoding gzip --content-type "text/plain; charset=utf-8"
            echo "[$TIER] 업로드 완료"
          done
