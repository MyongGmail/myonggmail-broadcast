# 명지메일 크롤러 v2 — GitHub Actions 스케줄 실행.
#
#   incremental : 매일 5회 (UTC 23/02/05/08/12 ≒ KST 08/11/14/17/21시)
#   backfill    : 매주 일요일 03:00 KST (= UTC 토 18:00) — 전량 페이지네이션
#   수동 실행    : Actions 탭 또는 `gh workflow run crawl.yml -f mode=backfill`
#
# 시크릿(설정 절차는 infra/README.md):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY                — 없으면 로컬 JSON 스냅샷만 생성
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  — 선택: 스냅샷 R2 백업

name: crawl

on:
  schedule:
    - cron: "0 23,2,5,8,12 * * *"  # incremental (KST 08/11/14/17/21시)
    - cron: "0 18 * * 6"           # backfill (KST 일요일 03:00) — Resolve mode 스텝과 문자열 일치 필수
  workflow_dispatch:
    inputs:
      mode:
        description: "크롤 모드"
        type: choice
        options:
          - incremental
          - backfill
        default: incremental

permissions:
  contents: read

concurrency:
  group: crawl-mju
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # backfill 전량(1.2초/요청) 대비. incremental은 수 분 내 종료.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # incremental 상태(known dedup_key)·병합 스냅샷을 실행 간에 이어받는다.
      # 캐시가 증발해도 Supabase upsert가 멱등이라 데이터는 안전(상세 재수집만 늘어남).
      - name: Restore snapshot state
        uses: actions/cache/restore@v4
        with:
          path: pipeline/snapshots
          key: snapshots-mju-${{ github.run_id }}
          restore-keys: |
            snapshots-mju-

      - name: Resolve mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          MODE=incremental
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 18 * * 6" ]; then
            MODE=backfill
          fi
          echo "mode=$MODE" | tee -a "$GITHUB_OUTPUT"

      - name: Crawl (incremental)
        if: steps.mode.outputs.mode == 'incremental'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -m pipeline.crawler.v2.run --school mju

      - name: Crawl (backfill)
        if: steps.mode.outputs.mode == 'backfill'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -m pipeline.crawler.v2.run --school mju --mode backfill --pages 0 --detail-limit 500

      # 크롤 성공 후 엣지 캐시(infra/cloudflare/api) 무효화 — 시크릿 미설정이면 스킵.
      - name: Purge edge cache (optional)
        env:
          PURGE_URL: ${{ secrets.PURGE_URL }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          if [ -z "$PURGE_URL" ] || [ -z "$PURGE_TOKEN" ]; then
            echo "PURGE 시크릿 미설정 — 엣지 캐시 퍼지 스킵(TTL 만료에 위임)"
            exit 0
          fi
          curl -sf -X POST "$PURGE_URL" -H "X-Purge-Token: $PURGE_TOKEN" \
            && echo "엣지 캐시 퍼지 완료" || echo "퍼지 실패(비치명) — TTL 만료에 위임"

      - name: Save snapshot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/snapshots
          key: snapshots-mju-${{ github.run_id }}

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_id }}
          path: pipeline/snapshots
          retention-days: 14
          if-no-files-found: warn

      # R2 시크릿 3종이 모두 설정된 경우에만 업로드(미설정이면 스킵 로그만 남김).
      # aws cli v2.23+의 CRC 체크섬 기본값은 R2와 충돌 — when_required로 고정.
      - name: Sync snapshots to R2 (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2 시크릿 미설정 — R2 업로드 스킵"
            exit 0
          fi
          aws s3 sync pipeline/snapshots "s3://myonggmail-snapshots" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      # P1b 방송(서킷 3 실체): v0 라인 포맷 생성 → public 버킷 정적 서빙.
      # 현재 입력은 리포 번들 notices_v2.json — Phase B에서 신선한 병합 산출로 교체 예정.
      # 버킷(myonggmail-broadcast)의 public access 설정은 사용자 Cloudflare 콘솔 작업.
      - name: Generate & sync broadcast v0 (optional)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 -m pipeline.broadcast.generate --verify
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "R2 시크릿 미설정 — 방송 업로드 스킵(생성·검증만 수행)"
            exit 0
          fi
          aws s3 sync pipeline/broadcast/out "s3://myonggmail-broadcast/v0" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
